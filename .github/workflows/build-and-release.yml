name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Extract Version Info
        id: version_info
        run: |
          MOD_VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          MC_VERSION=$(grep "^minecraft_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          MOD_NAME=$(grep "^mod_name=" gradle.properties | cut -d'=' -f2 | tr -d '\r')

          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${MOD_VERSION}"
          fi

          echo "mod_version=${MOD_VERSION}" >> $GITHUB_OUTPUT
          echo "mc_version=${MC_VERSION}" >> $GITHUB_OUTPUT
          echo "mod_name=${MOD_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=${MOD_NAME} v${MOD_VERSION} (MC ${MC_VERSION})" >> $GITHUB_OUTPUT

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NeoDungeonsLibs-artifacts
          path: build/libs/*.jar

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: ${{ steps.version_info.outputs.release_title }}
          files: build/libs/*.jar
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## NeoDungeonsLibs ${{ steps.version_info.outputs.mod_version }} for Minecraft ${{ steps.version_info.outputs.mc_version }}

            - Minecraft: ${{ steps.version_info.outputs.mc_version }}
            - Loader: NeoForge 21.1+

            Auto-built and released via GitHub Actions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
